name: Resumen diario DARKBAT

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  daily-summary:
    runs-on: ubuntu-latest
    steps:
      - name: Enviar resumen del día a Telegram
        run: |
          RESP=$(curl -s -o /dev/null -w "%{http_code}" -X POST https://darkbat-web.pages.dev/api/daily-summary)
          echo "daily-summary HTTP $RESP"
          if [ "$RESP" != "200" ]; then exit 1; fi
