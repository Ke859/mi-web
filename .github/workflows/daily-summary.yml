name: Resumen diario DARKBAT

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  daily-summary:
    runs-on: ubuntu-latest
    steps:
      - name: Enviar resumen del día a Telegram
        run: |
          URL="https://darkbat-web.pages.dev/api/daily-summary"
          if [ -n "${{ secrets.DAILY_SUMMARY_KEY }}" ]; then URL="$URL?key=${{ secrets.DAILY_SUMMARY_KEY }}"; fi
          RESP=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$URL")
          echo "daily-summary HTTP $RESP"
          if [ "$RESP" != "200" ]; then exit 1; fi
      - name: Enviar recordatorios de visitas de mañana
        run: |
          URL="https://darkbat-web.pages.dev/api/reminders"
          if [ -n "${{ secrets.DAILY_SUMMARY_KEY }}" ]; then URL="$URL?key=${{ secrets.DAILY_SUMMARY_KEY }}"; fi
          RESP=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$URL")
          echo "reminders HTTP $RESP"
          if [ "$RESP" != "200" ]; then exit 1; fi